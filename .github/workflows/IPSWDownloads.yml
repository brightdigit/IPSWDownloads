name: IPSWDownloads
on:
  push:
    branches-ignore:
      - '*WIP'
env:
  PACKAGE_NAME: IPSWDownloads      
jobs:
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    container: ${{ matrix.swift.nightly && format('swiftlang/swift:nightly-{0}-{1}', matrix.swift.version, matrix.os) || format('swift:{0}-{1}', matrix.swift.version, matrix.os) }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      matrix:
        os: [noble, jammy]
        swift:
          - version: "5.9"
          - version: "5.10"
          - version: "6.0"
          - version: "6.1"
          - version: "6.2"
          - version: "6.1"
            nightly: true
          - version: "6.2"
            nightly: true
        exclude:
          - os: noble
            swift:
              version: "5.9"
          - os: noble
            swift:
              version: "5.10"
    steps:
      - uses: actions/checkout@v4
      - uses: brightdigit/swift-build@v1.3.1
      - uses: sersoft-gmbh/swift-coverage-action@v4
        id: coverage-files
        with:          
          fail-on-empty-output: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4       
        with:
          fail_ci_if_error: true
          flags: swift-${{ matrix.swift-version }},ubuntu
          verbose: true        
          token: ${{ secrets.CODECOV_TOKEN }}  
          files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }} 
  build-windows:
    name: Build on Windows
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        runs-on: [windows-2022, windows-2025]
        include:
          - swift-version: swift-6.2-release
            swift-build: 6.2-RELEASE
          - swift-version: swift-6.1-release
            swift-build: 6.1-RELEASE
    steps:
      - uses: actions/checkout@v4
      - uses: brightdigit/swift-build@v1.3.1
        with:
          windows-swift-version: ${{ matrix.swift-version }}
          windows-swift-build: ${{ matrix.swift-build }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5    
        with:
          fail_ci_if_error: true
          flags: swift-${{ matrix.swift-version }},windows
          verbose: true        
          token: ${{ secrets.CODECOV_TOKEN }}
          os: windows
          swift_project: IPSWDownloads
          # files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }} 
  build-macos:
    name: Build on macOS
    env:
      PACKAGE_NAME: IPSWDownloads
    runs-on: ${{ matrix.runs-on }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # SPM Build Matrix
          - runs-on: macos-13
            xcode: "/Applications/Xcode_15.0.1.app"
          - runs-on: macos-13
            xcode: "/Applications/Xcode_15.1.app"
          - runs-on: macos-13
            xcode: "/Applications/Xcode_15.2.app"
          - runs-on: macos-15
            xcode: "/Applications/Xcode_16.1.app"
          - runs-on: macos-15
            xcode: "/Applications/Xcode_16.2.app"
          - runs-on: macos-15
            xcode: "/Applications/Xcode_16.4.app"
          - runs-on: macos-15
            xcode: "/Applications/Xcode_26.0.app"

          # macOS Build Matrix
          - type: macos
            runs-on: macos-13
            xcode: "/Applications/Xcode_15.0.1.app"
          - type: macos
            runs-on: macos-15
            xcode: "/Applications/Xcode_16.4.app"
          - type: macos
            runs-on: macos-15
            xcode: "/Applications/Xcode_26.0.app"

          # iOS Build Matrix
          - type: ios
            runs-on: macos-13
            xcode: "/Applications/Xcode_15.0.1.app"
            deviceName: "iPhone 15"
            osVersion: "17.0.1"
            download-platform: true
          - type: ios
            runs-on: macos-13
            xcode: "/Applications/Xcode_15.1.app"
            deviceName: "iPhone 15 Pro"
            osVersion: "17.2"
            download-platform: true
          - type: ios
            runs-on: macos-13
            xcode: "/Applications/Xcode_15.2.app"
            deviceName: "iPhone 15 Pro Max"
            osVersion: "17.2"
            download-platform: true
          - type: ios
            runs-on: macos-15
            xcode: "/Applications/Xcode_16.1.app"
            deviceName: "iPhone 16"
            osVersion: "18.1"
            download-platform: true
          - type: ios
            runs-on: macos-15
            xcode: "/Applications/Xcode_16.2.app"
            deviceName: "iPhone 16 Pro"
            osVersion: "18.3.1"
            download-platform: true
          - type: ios
            runs-on: macos-15
            xcode: "/Applications/Xcode_16.4.app"
            deviceName: "iPhone 16 Pro"
            osVersion: "18.5"
            download-platform: true
          - type: ios
            runs-on: macos-15
            xcode: "/Applications/Xcode_26.0.app"
            deviceName: "iPhone 17 Pro"
            osVersion: "26.0"
            download-platform: true

          # watchOS Build Matrix
          - type: watchos
            runs-on: macos-13
            xcode: "/Applications/Xcode_15.0.1.app"
            deviceName: "Apple Watch Series 9 (41mm)"
            osVersion: "10.0"
            download-platform: true
          - type: watchos
            runs-on: macos-13
            xcode: "/Applications/Xcode_15.1.app"
            deviceName: "Apple Watch Series 9 (45mm)"
            osVersion: "10.2"
            download-platform: true
          - type: watchos
            runs-on: macos-13
            xcode: "/Applications/Xcode_15.2.app"
            deviceName: "Apple Watch Ultra 2 (49mm)"
            osVersion: "10.2"
            download-platform: true
          - type: watchos
            runs-on: macos-15
            xcode: "/Applications/Xcode_16.1.app"
            deviceName: "Apple Watch Ultra 2 (49mm)"
            osVersion: "11.1"
            download-platform: true
          - type: watchos
            runs-on: macos-15
            xcode: "/Applications/Xcode_16.4.app"
            deviceName: "Apple Watch Ultra 2 (49mm)"
            osVersion: "11.5"
            download-platform: true
          - type: watchos
            runs-on: macos-15
            xcode: "/Applications/Xcode_26.0.app"
            deviceName: "Apple Watch Ultra 3 (49mm)"
            osVersion: "26.0"
            download-platform: true

          # tvOS Build Matrix
          - type: tvos
            runs-on: macos-15
            xcode: "/Applications/Xcode_26.0.app"
            deviceName: "Apple TV"
            osVersion: "26.0"
            download-platform: true

          # visionOS Build Matrix
          - type: visionos
            runs-on: macos-15
            xcode: "/Applications/Xcode_26.0.app"
            deviceName: "Apple Vision Pro"
            osVersion: "26.0"
            download-platform: true
  
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        uses: brightdigit/swift-build@v1.3.1
        with:
          scheme: ${{ env.PACKAGE_NAME }}
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}
          
      # Common Coverage Steps
      - name: Process Coverage
        uses: sersoft-gmbh/swift-coverage-action@v4
  
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type && format('{0}{1}', matrix.type, matrix.osVersion) || 'spm' }}
